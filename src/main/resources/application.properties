spring.application.name=product-pagination


# These values MUST match docker-compose.yml exactly
#                         ↓ matches POSTGRES_DB
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommercedb

#                            ↓ matches POSTGRES_USER
spring.datasource.username=admin

#                            ↓ matches POSTGRES_PASSWORD
spring.datasource.password=admin

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Flyway configuration

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true